name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Check tag matches versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./packages/extension/static/manifest.json').version")
          npm=$(node -p "require('./packages/companion/package.json').version")
          if [ "$tag" != "$ext" ] || [ "$tag" != "$npm" ]; then
            echo "Tag $tag, extension $ext, companion $npm must all match"; exit 1
          fi
      - name: Zip extensions
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd packages/extension/dist && zip -r "../../../keyglow-extension-$v.zip" .)
          (cd packages/extension/dist-firefox && zip -r "../../../keyglow-firefox-$v.zip" .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "keyglow-extension-$v.zip" "keyglow-firefox-$v.zip" \
            --title "KeyGlow $GITHUB_REF_NAME" --generate-notes
